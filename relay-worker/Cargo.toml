[package]
name = "relay-worker"
version = "0.1.0"
edition = "2021"
description = "Relay on Cloudflare Workers: the same proven posting policy, with D1, R2 and a cron trigger."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# Runs the D1 migrations and queries on SQLite in tests.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
# Small wasm starts faster, which keeps each request under the free
# plan's CPU limit (Cloudflare error 1102).
opt-level = "z"
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
