[package]
name = "relay"
version = "0.1.0"
edition = "2021"
description = "Our own slideshow poster: queue, safe scheduler, TikTok and Instagram publishing."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny_http = "0.12"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
